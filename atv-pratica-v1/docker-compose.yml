services:
  ollama:
    image: ollama/ollama
    container_name: ollama-v2
    ports:
      - "11434:11434"
    environment:
      OLLAMA_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
    external: true
    name: docker-ollama_ollama-data